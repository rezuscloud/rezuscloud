{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rezuscloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rezuscloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "rezuscloud.jwtSecret is required (or set existingSecret). Generate with: openssl rand -hex 32" .Values.jwtSecret | quote }}
  {{- with .Values.rezuscloud.adminPassword }}
  admin-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.rezuscloud.joinToken }}
  join-token: {{ . | quote }}
  {{- end }}
{{- end }}
