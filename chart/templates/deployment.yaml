{{- include "rezuscloud.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rezuscloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rezuscloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rezuscloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rezuscloud.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rezuscloud.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: rezuscloud
          image: {{ include "rezuscloud.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: REZUSCLOUD_ADDR
              value: {{ .Values.rezuscloud.addr | quote }}
            - name: REZUSCLOUD_DATA_DIR
              value: {{ .Values.rezuscloud.dataDir | quote }}
            - name: REZUSCLOUD_MODE
              value: {{ .Values.mode | quote }}
            - name: REZUSCLOUD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rezuscloud.secretName" . }}
                  key: jwt-secret
            {{- if or .Values.rezuscloud.adminPassword .Values.existingSecret }}
            - name: REZUSCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rezuscloud.secretName" . }}
                  key: admin-password
                  optional: true
            {{- end }}
            {{- if or .Values.rezuscloud.joinToken .Values.existingSecret }}
            - name: REZUSCLOUD_JOIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rezuscloud.secretName" . }}
                  key: join-token
                  optional: true
            {{- end }}
            {{- if .Values.rezuscloud.prometheusURL }}
            - name: REZUSCLOUD_PROMETHEUS_URL
              value: {{ .Values.rezuscloud.prometheusURL | quote }}
            {{- end }}
            {{- if .Values.rezuscloud.k8sAPIURL }}
            - name: REZUSCLOUD_K8S_API_URL
              value: {{ .Values.rezuscloud.k8sAPIURL | quote }}
            {{- end }}
            {{- if or .Values.rezuscloud.statePassphrase .Values.existingSecret }}
            - name: REZUSCLOUD_STATE_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "rezuscloud.secretName" . }}
                  key: state-passphrase
                  optional: true
            {{- end }}
            - name: REZUSCLOUD_LOG_FORMAT
              value: {{ .Values.rezuscloud.logFormat | quote }}
            - name: REZUSCLOUD_LOG_LEVEL
              value: {{ .Values.rezuscloud.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "rezuscloud.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
