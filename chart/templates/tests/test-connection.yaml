apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rezuscloud.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rezuscloud.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  containers:
    - name: wget
      image: gcr.io/distroless/static-debian12:nonroot
      command: ["/usr/bin/wget"]
      args:
        - --spider
        - --tries=3
        - --timeout=5
        - http://{{ include "rezuscloud.fullname" . }}:{{ .Values.service.port }}/healthz
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
