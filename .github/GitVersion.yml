# Milestone-driven versioning:
#   - patch: every merge to main releases the next patch (Mainline strategy;
#     any commit message bumps patch unless it carries a reserved bump token)
#   - minor/major: ONLY by closing a milestone titled vX.Y.Z — the
#     milestone-release workflow cuts that tag. The reserved bump tokens below
#     exist for GitVersion mechanics; using them by hand is forbidden, and the
#     release pipeline's stable-guard additionally refuses any minor/major
#     increase that has no matching vX.Y.0 milestone.
# Legacy prerelease tags (v0.0.1-N … v0.1.0-3) are cut off by ignore.commits-before.
strategies: [Mainline]
tag-prefix: '[vV]'
commit-message-incrementing: Enabled
minor-version-bump-message: '^\[bump:minor\]'
major-version-bump-message: '^\[bump:major\]'
patch-version-bump-message: '.+'
ignore:
  commits-before: 2026-09-06T13:00:00Z
branches:
  main:
    regex: ^main$
    label: ''
    increment: Patch
  pull-request:
    label: PullRequest{Number}
