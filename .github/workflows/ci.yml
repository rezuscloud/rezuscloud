name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  test:
    needs: lint
    strategy:
      matrix:
        include:
          - runner: [self-hosted, Linux, ARM64]
            goarch: arm64
          - runner: [self-hosted, Linux, X64]
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install C compiler (required for -race detector)
        run: which gcc || (sudo apt-get update -q && sudo apt-get install -y gcc)

      # Unified test: both server and CLI packages in one invocation.
      # Note: sqlite is now pure-Go (modernc.org/sqlite). CGO is still enabled
      # here because the -race detector requires it; production builds use
      # CGO_ENABLED=0.
      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -v -race -short -parallel 4 ./...

  integration-test:
    name: Integration tests (real tofu)
    # Integration tests exercise real binaries (the `tofu` CLI) and are gated
    # out of the fast unit-test job above via the `integration` build tag.
    # See CONTRIBUTING.md for the test-tier convention.
    needs: test
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install C compiler (required for -race detector)
        run: which gcc || (sudo apt-get update -q && sudo apt-get install -y gcc)

      # Pin the OpenTofu version we develop and test against. Single source of
      # truth: .opentofu-version (also consumed by the bundled tofu in #85).
      # tofu_wrapper: false installs the plain binary on PATH instead of the
      # output-capturing wrapper, so Go's exec.LookPath("tofu") works directly.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Run integration tests
        env:
          CGO_ENABLED: "1"
        run: go test -v -race -tags=integration -run '^TestIntegration' ./...

  build:
    needs: lint
    strategy:
      matrix:
        include:
          - runner: [self-hosted, Linux, ARM64]
            goarch: arm64
          - runner: [self-hosted, Linux, X64]
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build rezuscloud (management plane)
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >
          go build
          -ldflags="-s -w -X github.com/rezuscloud/rezuscloud/version.Version=ci -X github.com/rezuscloud/rezuscloud/version.GitCommit=$(git rev-parse --short HEAD) -X github.com/rezuscloud/rezuscloud/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -trimpath
          -o rezuscloud
          .

      - name: Build rezusctl (CLI)
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >
          go build
          -ldflags="-s -w -X github.com/rezuscloud/rezuscloud/internal/cli/version.Version=ci -X github.com/rezuscloud/rezuscloud/internal/cli/version.GitCommit=$(git rev-parse --short HEAD) -X github.com/rezuscloud/rezuscloud/internal/cli/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -trimpath
          -o rezusctl
          ./cmd/rezusctl

      - name: Verify binaries run
        run: |
          ./rezuscloud --help || true
          ./rezusctl --help || true

  docker-pr:
    name: Build and push PR image
    needs: [build, test, integration-test, helm]
    if: always() && needs.build.result == 'success' && needs.test.result == 'success' && needs.integration-test.result == 'success' && needs.helm.result == 'success' && github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.pr.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        if: steps.pr.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and push multi-arch image
        if: steps.pr.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/rezuscloud/rezuscloud:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}
          build-args: |
            VERSION=pr-${{ steps.pr.outputs.number }}
            GIT_COMMIT=${{ steps.pr.outputs.sha }}
            BUILD_TIME=${{ github.run_id }}

      - name: Verify manifest platforms
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/rezuscloud/rezuscloud:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}"
          platforms="$(docker buildx imagetools inspect "ghcr.io/rezuscloud/rezuscloud:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}" --raw \
            | jq -r '.manifests[]?.platform | select(.os != null and .architecture != null) | "\(.os)/\(.architecture)"' \
            | sort -u)"
          echo "Resolved platforms:"
          echo "$platforms"
          echo "$platforms" | grep -qx 'linux/amd64'
          echo "$platforms" | grep -qx 'linux/arm64'

      - name: Verify bundled tofu (#85)
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMG="ghcr.io/rezuscloud/rezuscloud:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}"
          VER="$(tr -d '[:space:]' < .opentofu-version)"
          echo "Pinned tofu version: $VER"
          # distroless/static has no shell, so invoke the binary as the entrypoint.
          OUT="$(docker run --rm --entrypoint /usr/local/bin/tofu "$IMG" version)"
          echo "$OUT" | grep -F "OpenTofu v$VER" \
            || { echo "::error::bundled tofu version mismatch; got:\n$OUT"; exit 1; }
          echo "OK: bundled tofu reports OpenTofu v$VER"

  helm:
    name: Chart lint and validate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint chart/

      - name: Lint chart (with required values)
        run: |
          helm lint chart/ \
            --set jwtSecret=ci-test-secret \
            --set rezuscloud.adminPassword=ci-test-password

      - name: Template chart (default scenario)
        run: |
          helm template rezuscloud chart/ \
            --set jwtSecret=ci-test-secret \
            --set rezuscloud.adminPassword=ci-test-password > /tmp/rendered-default.yaml
          echo "=== Rendered manifests (first 40 lines) ==="
          head -40 /tmp/rendered-default.yaml

      - name: Template chart (ingress enabled)
        run: |
          helm template rezuscloud chart/ \
            --set jwtSecret=ci-test-secret \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=rezuscloud.test > /tmp/rendered-ingress.yaml
          echo "=== Rendered ingress ==="
          cat /tmp/rendered-ingress.yaml | grep -A 20 "kind: Ingress"

      - name: Template chart (existing secret, no persistence)
        run: |
          helm template rezuscloud chart/ \
            --set existingSecret=my-secret \
            --set persistence.enabled=false > /tmp/rendered-nopvc.yaml
          echo "=== Verify no Secret/PVC created when existingSecret set ==="
          if grep -q "kind: Secret" /tmp/rendered-nopvc.yaml; then
            echo "FAIL: Secret was created when existingSecret was set"
            exit 1
          fi
          if grep -q "kind: PersistentVolumeClaim" /tmp/rendered-nopvc.yaml; then
            echo "FAIL: PVC was created when persistence.enabled=false"
            exit 1
          fi
          echo "OK: No Secret or PVC created"

      - name: Template chart (NetworkPolicy enabled)
        run: |
          helm template rezuscloud chart/ \
            --set jwtSecret=ci-test-secret \
            --set networkPolicy.enabled=true > /tmp/rendered-np.yaml
          grep -A 5 "kind: NetworkPolicy" /tmp/rendered-np.yaml

      - name: Fail-fast check (missing jwtSecret should error)
        run: |
          set +e
          helm template rezuscloud chart/ 2>&1 | grep -q "jwtSecret is required"
          if [ $? -ne 0 ]; then
            echo "Expected failure on missing jwtSecret did not occur"
            exit 1
          fi
          echo "Fail-fast validation works as expected"

      - name: Render all manifests to artifacts
        run: |
          mkdir -p /tmp/chart-renders
          cp /tmp/rendered-*.yaml /tmp/chart-renders/
          ls -la /tmp/chart-renders/

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: chart-renders
          path: /tmp/chart-renders/
          retention-days: 7
