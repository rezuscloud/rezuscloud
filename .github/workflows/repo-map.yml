name: Generate RIG

# Produces a deterministic Repository Intelligence Graph (RIG) JSON for the
# rezuscloud project and publishes it as a GitHub Release asset. The LLM Wiki
# instance (github.com/tibrezus/llm-wiki, deployed in rezusnet/operations
# platform wiki) fetches this asset on every wiki CI run and commits it to
# raw/arch/rezuscloud.rig.json — the single source of truth for the
# rezuscloud C4D2 architecture diagrams.
#
# See: https://arxiv.org/abs/2601.10112 (RIG) and the llm-wiki AGENTS.md
# "Graph contract" section.
#
# One entrypoint per binary:
#   - main.go                -> rezuscloud server (module github.com/rezuscloud/rezuscloud)
#   - cmd/rezusctl/main.go   -> rezusctl CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rig:
    name: Build + publish Repository Intelligence Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate RIG JSON
        uses: tibrezus/llm-wiki/.github/actions/repo-map@main
        with:
          language: go
          output: repo-map.json

      - name: Attach RIG to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: repo-map.json
