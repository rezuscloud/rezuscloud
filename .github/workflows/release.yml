name: Release

on:
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch:
    inputs:
      snapshot:
        description: Run in snapshot mode (no publish)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine Version
    if: github.event.inputs.snapshot != 'true'
    runs-on: [self-hosted, Linux, X64]
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      sha: ${{ steps.gitversion.outputs.sha }}
      shortSha: ${{ steps.gitversion.outputs.shortSha }}
      commitDate: ${{ steps.gitversion.outputs.commitDate }}
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      stable: ${{ steps.stable-guard.outputs.stable }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Deterministic for push, dispatch, and workflow_call (the milestone
          # release cuts its tag at main HEAD before calling this workflow).
          ref: main

      - name: Ensure full git history
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --prune --tags --unshallow || true
          shallow_file="$(git rev-parse --git-path shallow)"
          echo "shallow before cleanup: $(git rev-parse --is-shallow-repository)"
          if [ -f "$shallow_file" ]; then
            echo "removing stale shallow marker: $shallow_file"
            rm -f "$shallow_file"
          fi
          echo "shallow after cleanup: $(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Setup .NET
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          configFilePath: .github/GitVersion.yml
          disableShallowCloneCheck: true

      - name: Display Version
        run: |
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "CommitDate: ${{ steps.gitversion.outputs.commitDate }}"

      - name: Release gate (stable base + milestone rule)
        id: stable-guard
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Milestone-driven versioning: patch is continuous, minor/major only
          # via a vX.Y.0 milestone. Before the first stable tag exists, every
          # push skips — cut the bootstrap tag via milestone-release instead.
          LAST=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable version tag exists yet — release skipped. Cut the first stable tag via the milestone-release workflow."
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (last stable: $LAST)"

          # Hard gate: a minor/major increase over the last stable tag must be
          # backed by a milestone titled vX.Y.0 (or the exact version).
          cmaj=${VERSION%%.*}; cmin=$(cut -d. -f2 <<<"$VERSION")
          ver=${LAST#v}; lmaj=${ver%%.*}; lmin=$(cut -d. -f2 <<<"$ver")
          if [ "$cmaj" -gt "$lmaj" ] || { [ "$cmaj" -eq "$lmaj" ] && [ "$cmin" -gt "$lmin" ]; }; then
            titles=$(gh api "repos/$REPO/milestones?state=all" --paginate -q '.[].title')
            if echo "$titles" | grep -qx "v${cmaj}.${cmin}.0" || echo "$titles" | grep -qx "v$VERSION"; then
              echo "Minor/major increase is backed by milestone ✓"
            else
              echo "::error::$VERSION increases minor/major over $LAST without a milestone titled v${cmaj}.${cmin}.0 (or v$VERSION). Version lines only increase via milestones."
              exit 1
            fi
          fi

      - name: Check if tag exists
        if: steps.stable-guard.outputs.stable == 'true'
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.gitversion.outputs.majorMinorPatch }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create"
          fi

      - name: Create git tag
        if: steps.stable-guard.outputs.stable == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.gitversion.outputs.majorMinorPatch }}`;
            const sha = '${{ steps.gitversion.outputs.sha }}';
            console.log(`Creating tag ${tag} at ${sha}`);
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: sha
            });
            console.log(`Tag ${tag} created`);

  release:
    name: Release
    needs: version
    if: github.event.inputs.snapshot != 'true' && needs.version.outputs.semVer != '' && needs.version.outputs.version != '' && needs.version.outputs.stable == 'true' && needs.version.outputs.stable == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Install gettext-base
        run: which envsubst || (sudo apt-get update -q && sudo apt-get install -y gettext-base)

      - uses: sigstore/cosign-installer@v4.1.1

      - uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    name: Snapshot Build
    if: github.event.inputs.snapshot == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure full git history
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --prune --tags --unshallow || true
          shallow_file="$(git rev-parse --git-path shallow)"
          echo "shallow before cleanup: $(git rev-parse --is-shallow-repository)"
          if [ -f "$shallow_file" ]; then
            echo "removing stale shallow marker: $shallow_file"
            rm -f "$shallow_file"
          fi
          echo "shallow after cleanup: $(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Setup .NET
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          configFilePath: .github/GitVersion.yml
          disableShallowCloneCheck: true

      - name: Display Version
        run: |
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install gettext-base
        run: which envsubst || (sudo apt-get update -q && sudo apt-get install -y gettext-base)

      - uses: sigstore/cosign-installer@v4.1.1

      - uses: anchore/sbom-action/download-syft@v0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.gitversion.outputs.semVer }}
